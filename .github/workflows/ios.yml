name: iOS

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 의존성은 ios/deps/build-deps.sh나 ios/config.env가 바뀔 때만 다시 빌드하고 캐시에 둔다.
  deps:
    name: deps (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      matrix:
        platform: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ios

      - name: Restore cached deps
        id: cache
        uses: actions/cache@v6
        with:
          path: .deps/ios-${{ matrix.platform }}
          key: ios-deps-${{ matrix.platform }}-${{ hashFiles('ios/deps/**', 'ios/config.env') }}

      - name: Build deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash ios/deps/build-deps.sh ${{ matrix.platform }}

  libobs:
    name: libobs (${{ matrix.platform }})
    needs: deps
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iphoneos, iphonesimulator]
    env:
      BUILD_DIR: build_ios-${{ matrix.platform }}
      DEPS_DIR: ${{ github.workspace }}/.deps/ios-${{ matrix.platform }}
      DIST_DIR: ${{ github.workspace }}/dist/libobs-ios-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Load config
        run: cat ios/config.env >> "$GITHUB_ENV"

      - name: Restore cached deps
        uses: actions/cache/restore@v6
        with:
          path: .deps/ios-${{ matrix.platform }}
          key: ios-deps-${{ matrix.platform }}-${{ hashFiles('ios/deps/**', 'ios/config.env') }}
          fail-on-cache-miss: true

      - name: Configure
        run: |
          extra_args=()
          if [ "${{ matrix.platform }}" = iphonesimulator ]; then
            extra_args+=(-DENABLE_UNIT_TESTS=ON "-DCMAKE_CROSSCOMPILING_EMULATOR=/bin/bash;$PWD/ios/scripts/sim-run.sh")
          fi

          export PKG_CONFIG_LIBDIR="$DEPS_DIR/lib/pkgconfig"
          cmake -S obs-studio -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk ${{ matrix.platform }} --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$DEPS_DIR" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$DIST_DIR" \
            -DOBS_VERSION_OVERRIDE="$OBS_VERSION" \
            "${extra_args[@]}"

      - name: Build
        # -k 0: 첫 오류에서 멈추지 않고 모든 오류를 한 번에 보여 준다
        run: cmake --build "$BUILD_DIR" --parallel -- -k 0

      - name: Test on simulator
        if: matrix.platform == 'iphonesimulator'
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(((runtime, d) for runtime, ds in devices.items() if ".iOS-" in runtime for d in ds), key=lambda t: t[0])
          ipads = [d for _, d in ios if d["name"].startswith("iPad")] or [d for _, d in ios]
          print(ipads[-1]["udid"])
          ')
          xcrun simctl list devices | grep "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          SIM_UDID="$udid" ctest --test-dir "$BUILD_DIR" --output-on-failure --verbose --timeout 300
          # 종료 경합처럼 가끔만 터지는 문제를 잡으려고 짧은 스모크 테스트는 여러 번 돌린다
          SIM_UDID="$udid" ctest --test-dir "$BUILD_DIR" -R '^test_libobs_ios$' --repeat until-fail:30 --output-on-failure --timeout 120

      # 앱을 시뮬레이터에서 실제로 띄워 프리뷰 스크린숏과 로그를 남긴다
      - name: Run app on simulator
        if: matrix.platform == 'iphonesimulator'
        run: |
          app=$(ls -d "$BUILD_DIR"/app/*.app)
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          mkdir -p app-run

          # 라이선스 화면에 쓰는 파일이 번들에 들어갔는지 (계획 10.1)
          for license in app obs-studio ffmpeg librtmp rnnoise srt mbedtls jansson libcaption simde uthash; do
            test -s "$app/licenses/$license.txt" || { echo "missing license: $license"; exit 1; }
          done

          xcrun simctl install "$SIM_UDID" "$app"
          # 권한 창이 스크린숏을 가리지 않게 미리 허용한다 (시뮬레이터에는 카메라가 없다)
          xcrun simctl privacy "$SIM_UDID" grant camera "$bundle_id" || true
          xcrun simctl privacy "$SIM_UDID" grant microphone "$bundle_id" || true

          # 출력 시험 (P3): 앱이 입력 소스가 준비된 뒤 녹화와 RTMP 송출을 20초 동안 함께 돌린다.
          # 송출은 로컬 ffmpeg가 받는다 (시뮬레이터는 호스트와 네트워크를 같이 쓴다).
          command -v ffmpeg > /dev/null || brew install ffmpeg

          # 미디어 소스 시험 (P5): 3초짜리 H.264+AAC 파일을 앱의 Documents에 넣어 둔다 (씬 자동 시험이 반복 재생)
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=30 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k -shortest app-run/test-media.mp4
          media_dir=$(xcrun simctl get_app_container "$SIM_UDID" "$bundle_id" data)/Documents
          mkdir -p "$media_dir"
          cp app-run/test-media.mp4 "$media_dir/"

          ffmpeg -nostdin -hide_banner -listen 1 -timeout 150 -i rtmp://127.0.0.1:1935/live/autotest \
            -c copy -f flv app-run/received.flv > app-run/ffmpeg-rtmp.log 2>&1 &
          ffmpeg_pid=$!

          # 시뮬레이터 인코더는 소프트웨어라 캔버스를 줄인다 (1080p60은 실기기에서 확인)
          # -autotest-scenes: 씬·소스 조작을 한 바퀴 돌리고 "시험 장면"을 남겨 저장한다 (P4)
          xcrun simctl launch --console-pty "$SIM_UDID" "$bundle_id" -canvas 640x360@30 -autotest-scenes \
            -autotest-output 20 rtmp://127.0.0.1:1935/live > app-run/app.log 2>&1 &
          # CI 시뮬레이터의 GPU가 느려 첫 화면이 늦게 뜰 수 있어 여러 번 찍는다
          for t in 10 40 80; do
            sleep $((t - ${prev:-0})); prev=$t
            xcrun simctl io "$SIM_UDID" screenshot "app-run/simulator-${t}s.png"
          done

          # 멈춤 진단용: 모든 스레드의 스택과 시스템 로그
          pid=$(pgrep -f "$(basename "$app")/" | head -1 || true)
          if [ -n "$pid" ]; then sample "$pid" 2 -file app-run/sample.txt > /dev/null 2>&1 || true; fi
          xcrun simctl spawn "$SIM_UDID" log show --last 1m --style compact \
            --predicate "process == \"$(basename "$app" .app)\"" > app-run/system.log 2>&1 || true

          # 앱이 Documents에 남기는 로그 파일 (기기에서 파일 앱으로 보는 것과 같은 파일)
          data_dir=$(xcrun simctl get_app_container "$SIM_UDID" "$bundle_id" data || true)
          if [ -n "$data_dir" ]; then
            cp "$data_dir/Documents/broadcast.log" app-run/ || true
            cp "$data_dir/Documents/Recordings/autotest.mp4" app-run/ || true
            # 리플레이 버퍼가 저장한 파일 (P5)
            for replay in "$data_dir"/Documents/Recordings/Replay*.mp4; do
              if [ -f "$replay" ]; then cp "$replay" app-run/replay.mp4; fi
            done
          fi

          xcrun simctl terminate "$SIM_UDID" "$bundle_id" || true
          sleep 2

          # 씬 구성 저장·불러오기: 다시 띄우면 기본 씬과 "시험 장면", 2개를 불러와야 한다
          # 이번에는 SRT 송출(P5)을 10초 돌린다. 러너의 ffmpeg에는 SRT가 없어 받는 쪽은 libsrt의
          # srt-live-transmit listener (받은 MPEG-TS를 그대로 파일로, 송출이 끊기면 끝남)
          brew list srt > /dev/null 2>&1 || brew install srt
          srt-live-transmit -a:no -t:120 'srt://:9000?mode=listener' file://con \
            > app-run/received-srt.ts 2> app-run/ffmpeg-srt.log &
          ffmpeg_srt_pid=$!
          xcrun simctl launch --console-pty "$SIM_UDID" "$bundle_id" -canvas 640x360@30 \
            -autotest-srt 10 srt://127.0.0.1:9000 > app-run/app-relaunch.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'capture started' app-run/app-relaunch.log && break
            sleep 2
          done
          xcrun simctl io "$SIM_UDID" screenshot app-run/simulator-relaunch.png || true
          for _ in $(seq 1 30); do
            grep -q 'srt autotest: done' app-run/app-relaunch.log && break
            sleep 2
          done
          xcrun simctl terminate "$SIM_UDID" "$bundle_id" || true
          sleep 2
          (sleep 5; kill "$ffmpeg_srt_pid" 2> /dev/null) &
          wait "$ffmpeg_srt_pid" || true
          cat app-run/ffmpeg-srt.log

          # 송출이 끝나면 ffmpeg도 끝난다. 연결조차 안 됐으면 기다리지 않고 끝낸다
          (sleep 5; kill "$ffmpeg_pid" 2> /dev/null) &
          wait "$ffmpeg_pid" || true
          cat app-run/ffmpeg-rtmp.log

          cat app-run/app.log
          grep -q 'core started' app-run/app.log
          # 빌드 정보 (BuildInfo.swift): 로그 첫머리에 이 실행의 번호
          grep -q "build: #$GITHUB_RUN_NUMBER " app-run/app.log
          grep -q '\[stats\]' app-run/app.log
          grep -q 'capture started (camera: yes, audio input: yes)' app-run/app.log
          # 시뮬레이터 마이크(CI에서는 무음)로도 버퍼가 libobs까지 오는지 본다
          grep -q 'ios-audio-input\] first buffer' app-run/app.log
          if grep -q 'failed to load' app-run/app.log; then exit 1; fi
          grep -q 'capture started' app-run/broadcast.log

          # 씬·소스 (P4)
          grep -q 'created the default scene' app-run/app.log
          grep -q 'scenes autotest: ok' app-run/app.log
          # 미리보기 끄기·켜기: 디스플레이를 없앴다가 다시 만들고, 꺼진 동안에도 캔버스는 돈다
          awk '/preview autotest: off/ { s = 1 } s == 1 && /display destroyed/ { s = 2 }
               s == 2 && /\[stats\] fps=[1-9]/ { s = 3 } s == 3 && /preview autotest: on/ { s = 4 }
               s == 4 && /display created/ { s = 5 } END { exit s == 5 ? 0 : 1 }' app-run/app.log
          # 오디오 필터: 노이즈 억제(RNNoise)를 넣고 바꾸고, 저장한 것을 다시 띄울 때 불러온다
          grep -q 'filters autotest: ok' app-run/app.log
          # 사진 가져오기 (D14): 돌려 찍은 P3 HEIC → 바로 세운 sRGB JPEG, 투명 PNG는 그대로, 이미지 소스·슬라이드쇼 목록
          grep -q 'photos autotest: ok' app-run/app.log
          # 미디어 소스 (P5): 테스트 파일을 디코딩해 첫 프레임을 내고, 끝나면 반복한다
          grep -q 'media autotest: added' app-run/app.log
          grep -q 'ios-media-source: .*first video frame 640x360' app-run/app.log
          grep -q 'ios-media-source: .*looping (play 2)' app-run/app.log
          cat app-run/app-relaunch.log
          grep -q 'loaded 2 scene(s)' app-run/app-relaunch.log
          grep -q "audio input '.*' has 1 filter(s)" app-run/app-relaunch.log

          # 녹화 파일(Hybrid MP4), 받은 송출(FLV), 리플레이를 ffprobe로 확인: 비디오·오디오 코덱과 길이
          check_media() {
            local file=$1 video=$2 min=${3:-10} max=${4:-100000}
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height:format=duration \
              -of default=noprint_wrappers=1 "$file" | tee "$file.txt"
            grep -Eq "codec_name=($video)" "$file.txt"
            grep -q 'codec_name=aac' "$file.txt"
            awk -F= -v min="$min" -v max="$max" \
              '/^duration=/ { found = 1; if ($2 + 0 < min || $2 + 0 > max) exit 1 } END { if (!found) exit 1 }' "$file.txt"
          }
          check_media app-run/autotest.mp4 'hevc|h264'
          check_media app-run/received.flv 'h264'
          # 리플레이 버퍼 10초: 키프레임(2초 간격)부터 시작하므로 8~11초
          grep -q '\[app\] replay saved: ' app-run/app.log
          check_media app-run/replay.mp4 'hevc|h264' 7.5 11.5
          # SRT 송출 10초 (P5)
          grep -q 'srt autotest: started true' app-run/app-relaunch.log
          grep -q "srt autotest: done (stream error '')" app-run/app-relaunch.log
          check_media app-run/received-srt.ts 'h264' 7
          # 통과하면 큰 미디어 파일은 아티팩트에서 뺀다 (실패하면 남겨서 내려받아 볼 수 있게)
          rm -f app-run/autotest.mp4 app-run/received.flv app-run/replay.mp4 app-run/test-media.mp4 app-run/received-srt.ts

      - uses: actions/upload-artifact@v7
        if: always() && matrix.platform == 'iphonesimulator'
        with:
          name: app-simulator-run
          path: app-run
          if-no-files-found: ignore

      # fake-signed IPA (계획 8.3). 설치는 LiveContainer로 한다.
      - name: Package IPA
        if: matrix.platform == 'iphoneos'
        run: |
          app=$(ls -d "$BUILD_DIR"/app/*.app)
          name=$(basename "$app" .app)
          # 번들 안에 dSYM이 있으면 LiveContainer가 설치할 때 서명에 실패한다 (app/CMakeLists.txt 참고)
          if find "$app" -name '*.dSYM' | grep -q .; then
            echo "dSYM inside the app bundle:"; find "$app" -name '*.dSYM'; exit 1
          fi
          # 어느 실행의 빌드인지 파일 이름과 LiveContainer 목록(버전 0.1.<실행 번호>)에서 알아보게 (app/CMakeLists.txt)
          branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          test "$version" = "0.1.$GITHUB_RUN_NUMBER"
          ipa="$name-$GITHUB_RUN_NUMBER-${branch//\//-}-${GITHUB_SHA::7}.ipa"
          mkdir -p dist/ipa/Payload
          cp -R "$app" dist/ipa/Payload/
          (cd dist/ipa && zip -qry "../$ipa" Payload)
          dsymutil "$app/$name" -o "dist/$name.app.dSYM"
          codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature'
          ls -la dist
          {
            echo "### 기기용 IPA: 빌드 #$GITHUB_RUN_NUMBER"
            echo "- 브랜치 \`$branch\`, 커밋 \`${GITHUB_SHA::7}\`"
            echo "- 아티팩트 \`app-ipa-$GITHUB_RUN_NUMBER\`, 파일 \`$ipa\`"
            echo "- LiveContainer 목록에는 버전 \`$version\`, 앱 오버레이와 설정 › 정보에는 \`#$GITHUB_RUN_NUMBER $branch\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'iphoneos'
        with:
          name: app-ipa-${{ github.run_number }}
          path: |
            dist/*.ipa
            dist/*.dSYM

      - name: Show crash reports
        if: failure() && matrix.platform == 'iphonesimulator'
        run: python3 ios/scripts/print-crash-reports.py ~/Library/Logs/DiagnosticReports '*'

      - name: Install
        run: cmake --install "$BUILD_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: libobs-ios-${{ matrix.platform }}
          path: dist/libobs-ios-${{ matrix.platform }}
